<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <title>DesmosLock v2 Internal</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Secure staff workspace</p>
          <p class="brand" aria-label="DesmosLock">DesmosLock</p>
        </div>
        <p
          class="backend-status"
          data-v2-status
          role="status"
          aria-live="polite"
        >
          Connecting securely…
        </p>
      </header>
      <section
        class="auth-surface"
        data-staff-auth-root
        aria-label="Staff authentication"
        hidden
      ></section>
      <section data-protected-school-data hidden></section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>

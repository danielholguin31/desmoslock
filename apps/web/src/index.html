<!doctype html>
<html lang="en">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keep the icon inline so callback credentials are scrubbed before any
         network request can carry the original address. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23172033'/%3E%3Cpath d='M22 29v-5a10 10 0 0 1 20 0v5' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3Crect x='17' y='27' width='30' height='25' rx='6' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script data-staff-auth-bootstrap>
      (() => {
        "use strict";

        const sensitiveCallbackParameter =
          /(?:^|[?&#])(?:access_token|auth|code|error(?:_code|_description)?|flow|refresh_token|sb_flow_id|state|token(?:_hash)?|type)(?:=|&|$)/iu;
        let callbackUrl = null;
        let callbackWasScrubbed = false;

        const containsSensitiveCallbackParameter = (value) => {
          if (sensitiveCallbackParameter.test(value)) return true;
          try {
            return sensitiveCallbackParameter.test(decodeURIComponent(value));
          } catch {
            return false;
          }
        };
        const failClosed = () => {
          callbackUrl = null;
          document.documentElement.hidden = true;
          try {
            window.stop();
          } catch {
            // Keeping the document hidden remains fail-closed if stop fails.
          }
        };

        try {
          const callbackMaterialPresent =
            containsSensitiveCallbackParameter(window.location.search) ||
            containsSensitiveCallbackParameter(window.location.hash);
          if (callbackMaterialPresent) {
            callbackUrl = window.location.href;
            window.history.replaceState(
              Object.freeze({
                desmoslockStaffAuthCallback: "pending-v1",
              }),
              "",
              "/",
            );
            callbackWasScrubbed = true;
          }
        } catch {
          failClosed();
          return;
        }

        try {
          // Creating the link here also prevents speculative stylesheet
          // loading from discovering a resource before callback scrubbing.
          const stylesheet = document.createElement("link");
          stylesheet.rel = "stylesheet";
          stylesheet.href = "./styles.css";
          document.head.append(stylesheet);

          // The callback remains private while the module loads. Nothing on
          // window or document can claim it, even before the module is ready.
          import("./main.js")
            .then((applicationModule) => {
              const bootstrap = Object.freeze({
                callbackUrl,
                callbackWasScrubbed,
              });
              callbackUrl = null;
              applicationModule.bootWebApplication(bootstrap);
            })
            .catch(failClosed);
        } catch {
          failClosed();
        }
      })();
    </script>
    <title>DesmosLock v2 Internal</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Secure staff workspace</p>
          <p class="brand" aria-label="DesmosLock">DesmosLock</p>
        </div>
        <p
          class="backend-status"
          data-v2-status
          role="status"
          aria-live="polite"
        >
          Connecting securely…
        </p>
      </header>
      <section data-protected-school-data hidden></section>
      <section
        class="auth-surface"
        data-staff-auth-root
        aria-label="Staff authentication"
        hidden
      ></section>
    </main>
  </body>
</html>

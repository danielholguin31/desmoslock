<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>Confirm your DesmosLock email</title>
  </head>
  <body>
    <h1>Confirm your email</h1>
    <p>Continue to DesmosLock to confirm your email address.</p>
    <p>
      <a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=signup">
        Continue to DesmosLock
      </a>
    </p>
    <p>If you did not request this email, you can ignore it.</p>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your DesmosLock password</title>
  </head>
  <body>
    <h1>Reset your DesmosLock password</h1>
    <p>
      Open this link in the browser where you requested the reset. DesmosLock
      will ask you to continue before verifying the link.
    </p>
    <p>
      <a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=recovery">
        Continue to DesmosLock
      </a>
    </p>
    <p>If you did not request a password reset, you can ignore this email.</p>
  </body>
</html>

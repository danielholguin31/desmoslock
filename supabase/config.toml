project_id = "desmoslock-v2"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "desmoslock_v2"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "https://desmoslock.invalid"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.email.template.recovery]
subject = "Reset your DesmosLock password"
content_path = "./supabase/templates/recovery-v1.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.account-recovery]
verify_jwt = false

[functions.health]
verify_jwt = false

[functions.staff-invitations]
verify_jwt = true

[analytics]
enabled = false

[functions.student-session-challenge]
verify_jwt = false

[functions.student-session-join]
verify_jwt = false

[functions.student-session-read]
verify_jwt = false

[functions.student-session-reconnect]
verify_jwt = false

[functions.student-session-forfeit]
verify_jwt = false

# Original admitted device evidence is authenticated by its retained Ed25519 proof.
[functions.student-session-evidence]
verify_jwt = false

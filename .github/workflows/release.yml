name: Legacy v1 release (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep every public release mutation serialized, even across different tags.
  group: desmoslock-public-release
  cancel-in-progress: false

env:
  RELEASES_REPOSITORY: danielholguin31/desmoslock-releases

jobs:
  legacy-v1-release-disabled:
    name: Legacy v1 release is disabled during v2 expansion
    runs-on: ubuntu-latest
    steps:
      - name: Reject legacy packaging and publication
        run: |
          echo "::error::Legacy v1 cannot produce a GA artifact during the v2 expand phase."
          exit 1

  trusted-source:
    if: ${{ false }}
    name: Verify trusted release source
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.preflight.outputs.is_release }}
      source_sha: ${{ steps.preflight.outputs.source_sha }}
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require protected main or a contained version tag
        id: preflight
        shell: bash
        env:
          TRUSTED_BRANCH: main
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*" >&2
            exit 1
          }

          require_public_releases_repository() {
            local response_file="$RUNNER_TEMP/releases-repository.json"
            local status
            status=$(curl --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/$RELEASES_REPOSITORY")
            [[ "$status" == 200 ]] || fail \
              "The public releases repository is unavailable (HTTP $status)."
            [[ "$(node -e \
              "const d=require(process.argv[1]); process.stdout.write(String(d.private))" \
              "$response_file")" == false ]] || fail \
              "The releases repository must be public before signing credentials are used."
          }

          assert_newer_than_latest() {
            local candidate_tag=$1
            local response_file="$RUNNER_TEMP/latest-release.json"
            local status latest_tag
            status=$(curl --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/$RELEASES_REPOSITORY/releases/latest")

            case "$status" in
              200)
                latest_tag=$(node -e \
                  "const d=require(process.argv[1]); process.stdout.write(String(d.tag_name || ''))" \
                  "$response_file")
                node - "$candidate_tag" "$latest_tag" <<'NODE'
          const parse = (tag) => {
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag);
            if (!match) throw new Error(`not a strict stable SemVer tag: ${tag}`);
            return match.slice(1).map((part) => BigInt(part));
          };
          try {
            const candidate = parse(process.argv[2]);
            const latest = parse(process.argv[3]);
            const comparison = candidate.findIndex((part, index) => part !== latest[index]);
            if (comparison === -1 || candidate[comparison] < latest[comparison]) {
              throw new Error(`${process.argv[2]} is not newer than latest ${process.argv[3]}`);
            }
          } catch (error) {
            console.error(`::error::${error.message}`);
            process.exit(1);
          }
          NODE
                ;;
              404)
                echo "No current latest release exists; monotonic guard allows the first release."
                ;;
              *)
                fail "Could not determine the current latest release (HTTP $status)."
                ;;
            esac
          }

          package_version=$(node -p "require('./desktop/package.json').version")
          [[ "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || \
            fail "Desktop version must be strict stable SemVer; found $package_version."

          source_sha=$(git rev-parse "${GITHUB_SHA}^{commit}")
          [[ "$source_sha" == "$(git rev-parse 'HEAD^{commit}')" ]] || fail \
            "Checked-out source does not match GITHUB_SHA."
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [[ "$GITHUB_REF" == "refs/heads/$TRUSTED_BRANCH" ]] || fail \
                "workflow_dispatch must run from refs/heads/$TRUSTED_BRANCH."
              is_release=false
              ;;
            push)
              [[ "$GITHUB_REF" == refs/tags/v* ]] || fail \
                "Only v* tag pushes may use the tag release path."
              [[ "$GITHUB_REF_NAME" == "v$package_version" ]] || fail \
                "Tag $GITHUB_REF_NAME does not match desktop version $package_version."
              git show-ref --verify --quiet "refs/remotes/origin/$TRUSTED_BRANCH" || fail \
                "Fetched protected branch origin/$TRUSTED_BRANCH is missing."
              git merge-base --is-ancestor \
                "$source_sha" "refs/remotes/origin/$TRUSTED_BRANCH" || fail \
                "Tagged commit $source_sha is not contained in protected $TRUSTED_BRANCH."
              assert_newer_than_latest "$GITHUB_REF_NAME"
              is_release=true
              ;;
            *)
              fail "Unsupported workflow event: $GITHUB_EVENT_NAME."
              ;;
          esac

          require_public_releases_repository
          {
            echo "is_release=$is_release"
            echo "source_sha=$source_sha"
            echo "version=$package_version"
          } >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build and verify macOS
    needs: trusted-source
    if: ${{ needs.trusted-source.result == 'success' }}
    runs-on: macos-latest
    environment: macos-signing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Pin npm 10
        run: npm install --global npm@10

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Bundle supabase-js
        working-directory: desktop
        run: npm run build:vendor

      - name: Prepare notarization key
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for required_name in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_API_KEY_B64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            APPLE_TEAM_ID
          do
            if [[ -z "${!required_name:-}" ]]; then
              echo "::error::Required secret is not configured: ${required_name}"
              exit 1
            fi
          done

          [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "::error::APPLE_API_KEY_ID must be a 10-character key ID"
            exit 1
          }
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo "::error::APPLE_TEAM_ID must be a 10-character team ID"
            exit 1
          }
          [[ "$APPLE_API_ISSUER" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]] || {
            echo "::error::APPLE_API_ISSUER must be an issuer UUID"
            exit 1
          }

          key_path="${RUNNER_TEMP}/notarization-key.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$key_path" || {
            echo "::error::APPLE_API_KEY_B64 did not decode to a .p8 private key"
            exit 1
          }
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS installers
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never

      - name: Verify both macOS installers
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          arm64_dmgs=(dist/*arm64*.dmg)
          intel_dmgs=(dist/*x64*.dmg)
          [[ ${#arm64_dmgs[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one arm64 DMG, found ${#arm64_dmgs[@]}"
            exit 1
          }
          [[ ${#intel_dmgs[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one x64 DMG, found ${#intel_dmgs[@]}"
            exit 1
          }
          scripts/verify-macos-dmg.sh "${arm64_dmgs[0]}" arm64
          scripts/verify-macos-dmg.sh "${intel_dmgs[0]}" x86_64

      - name: Remove temporary notarization key
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          runner_temp=$(cd "${RUNNER_TEMP:?RUNNER_TEMP is required}" && pwd -P)
          [[ "$runner_temp" != / ]] || {
            echo "::error::RUNNER_TEMP must be a non-root absolute path"
            exit 1
          }
          key_path="$runner_temp/notarization-key.p8"
          case "$key_path" in
            "$runner_temp"/*) rm -f -- "$key_path" ;;
            *)
              echo "::error::Refusing to remove unexpected notarization key path"
              exit 1
              ;;
          esac

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-macOS
          path: desktop/dist/*.dmg
          if-no-files-found: error

  build-other:
    name: Build ${{ matrix.name }}
    needs: trusted-source
    if: ${{ needs.trusted-source.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            builder_args: --win
            extension: exe
          - os: ubuntu-latest
            name: Linux
            builder_args: --linux
            extension: AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Pin npm 10
        run: npm install --global npm@10

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Bundle supabase-js
        working-directory: desktop
        run: npm run build:vendor

      - name: Build ${{ matrix.name }} installer
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload ${{ matrix.name }} installer
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: desktop/dist/*.${{ matrix.extension }}
          if-no-files-found: error

  stage-release:
    name: Stage public draft release
    needs:
      - trusted-source
      - build-macos
      - build-other
    if: >-
      ${{ needs.trusted-source.result == 'success' &&
          needs.trusted-source.outputs.is_release == 'true' &&
          needs.build-macos.result == 'success' &&
          needs.build-other.result == 'success' }}
    runs-on: ubuntu-latest
    environment: public-releases-write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require tag to match the desktop version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./desktop/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match desktop version ${package_version}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts

      - name: Stage stable asset names and checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          arm64_dmgs=(artifacts/**/*arm64*.dmg)
          intel_dmgs=(artifacts/**/*x64*.dmg)
          windows_installers=(artifacts/**/*.exe)
          linux_installers=(artifacts/**/*.AppImage)

          [[ ${#arm64_dmgs[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one arm64 DMG, found ${#arm64_dmgs[@]}"
            exit 1
          }
          [[ ${#intel_dmgs[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one x64 DMG, found ${#intel_dmgs[@]}"
            exit 1
          }
          [[ ${#windows_installers[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one Windows installer, found ${#windows_installers[@]}"
            exit 1
          }
          [[ ${#linux_installers[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one Linux installer, found ${#linux_installers[@]}"
            exit 1
          }

          mkdir out
          cp "${arm64_dmgs[0]}" out/DesmosLock-mac.dmg
          cp "${intel_dmgs[0]}" out/DesmosLock-mac-intel.dmg
          cp "${windows_installers[0]}" out/DesmosLock-setup.exe
          cp "${linux_installers[0]}" out/DesmosLock.AppImage
          (
            cd out
            sha256sum \
              DesmosLock-mac.dmg \
              DesmosLock-mac-intel.dmg \
              DesmosLock-setup.exe \
              DesmosLock.AppImage > SHA256SUMS.txt
          )

          cat > out/RELEASE_NOTES.md <<EOF
          Built from private source commit \`${{ needs.trusted-source.outputs.source_sha }}\`.

          ## Installing

          **macOS** — Open the DMG, drag DesmosLock to Applications, and launch it
          normally from Applications. The macOS builds are Developer ID signed,
          notarized, stapled, and verified before this release is published.

          **Windows** — Windows signing is not part of this release hardening work,
          so SmartScreen may still display a warning.

          SHA-256 values for every installer are in \`SHA256SUMS.txt\`.
          EOF

      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?RELEASES_REPO_TOKEN environment secret is required}"
          set +e
          release_state=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$RELEASES_REPOSITORY" \
            --json isDraft \
            --jq .isDraft 2>&1)
          view_status=$?
          set -e

          if [[ $view_status -eq 0 ]]; then
            [[ "$release_state" == true ]] || {
              echo "::error::Refusing to replace assets on an already-published release"
              exit 1
            }
            echo "An existing draft will be updated and reverified."
          elif [[ "$release_state" == "release not found" ]]; then
            echo "No existing release was found; a new draft will be created."
          else
            echo "::error::Could not safely determine the target release state"
            exit 1
          fi

      - name: Create or update draft in the public releases repository
        # v2 pinned because this step receives the public-repository write token.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          repository: danielholguin31/desmoslock-releases
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          name: DesmosLock ${{ github.ref_name }}
          body_path: out/RELEASE_NOTES.md
          draft: true
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            out/DesmosLock-mac.dmg
            out/DesmosLock-mac-intel.dmg
            out/DesmosLock-setup.exe
            out/DesmosLock.AppImage
            out/SHA256SUMS.txt
          token: ${{ secrets.RELEASES_REPO_TOKEN }}

  verify-draft:
    name: Redownload and verify public draft
    needs:
      - trusted-source
      - stage-release
    if: >-
      ${{ needs.trusted-source.result == 'success' &&
          needs.trusted-source.outputs.is_release == 'true' &&
          needs.stage-release.result == 'success' }}
    runs-on: macos-latest
    environment: public-releases-read
    outputs:
      manifest_sha256: ${{ steps.verify.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download draft assets from the public releases repository
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?RELEASES_REPO_READ_TOKEN environment secret is required}"
          mkdir downloaded
          gh release download "$GITHUB_REF_NAME" \
            --repo "$RELEASES_REPOSITORY" \
            --dir downloaded

      - name: Verify checksums and both macOS installers
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            DesmosLock-mac.dmg
            DesmosLock-mac-intel.dmg
            DesmosLock-setup.exe
            DesmosLock.AppImage
            SHA256SUMS.txt
          )
          for asset in "${expected_assets[@]}"; do
            [[ -f "downloaded/$asset" ]] || {
              echo "::error::Draft release is missing $asset"
              exit 1
            }
          done
          asset_count=$(find downloaded -maxdepth 1 -type f | wc -l | tr -d ' ')
          [[ "$asset_count" -eq ${#expected_assets[@]} ]] || {
            echo "::error::Expected exactly ${#expected_assets[@]} draft assets, found $asset_count"
            exit 1
          }
          (cd downloaded && shasum -a 256 -c SHA256SUMS.txt)
          desktop/scripts/verify-macos-dmg.sh downloaded/DesmosLock-mac.dmg arm64
          desktop/scripts/verify-macos-dmg.sh downloaded/DesmosLock-mac-intel.dmg x86_64
          manifest_sha256=$(shasum -a 256 downloaded/SHA256SUMS.txt | awk '{print $1}')
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Invalid SHA256SUMS.txt digest: $manifest_sha256"
            exit 1
          }
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

  publish-prerelease:
    name: Publish verified non-latest prerelease
    needs:
      - trusted-source
      - verify-draft
    if: >-
      ${{ needs.trusted-source.result == 'success' &&
          needs.trusted-source.outputs.is_release == 'true' &&
          needs.verify-draft.result == 'success' }}
    runs-on: ubuntu-latest
    environment: public-releases-write
    steps:
      - name: Publish draft as a public prerelease without changing latest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?RELEASES_REPO_TOKEN environment secret is required}"
          release_id=$(gh api \
            "repos/$RELEASES_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq .id)
          [[ "$(gh api "repos/$RELEASES_REPOSITORY/releases/$release_id" --jq .draft)" == true ]] || {
            echo "::error::Expected $GITHUB_REF_NAME to still be a draft"
            exit 1
          }
          gh api --method PATCH \
            "repos/$RELEASES_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false \
            --silent
          state=$(gh api \
            "repos/$RELEASES_REPOSITORY/releases/$release_id" \
            --jq '[.draft, .prerelease] | @tsv')
          [[ "$state" == $'false\ttrue' ]] || {
            echo "::error::Release did not become a public prerelease: $state"
            exit 1
          }

  verify-public-assets:
    name: Verify unauthenticated tag-specific downloads
    needs:
      - trusted-source
      - verify-draft
      - publish-prerelease
    if: >-
      ${{ needs.trusted-source.result == 'success' &&
          needs.trusted-source.outputs.is_release == 'true' &&
          needs.verify-draft.result == 'success' &&
          needs.publish-prerelease.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify every public asset without authentication
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.verify-draft.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Missing verified draft manifest digest"
            exit 1
          }
          mkdir public-assets
          release_url="https://github.com/${RELEASES_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --output public-assets/SHA256SUMS.txt \
            "${release_url}/SHA256SUMS.txt"
          public_manifest_sha256=$(sha256sum public-assets/SHA256SUMS.txt | awk '{print $1}')
          [[ "$public_manifest_sha256" == "$EXPECTED_MANIFEST_SHA256" ]] || {
            echo "::error::Public SHA256SUMS.txt does not match the verified draft manifest"
            exit 1
          }
          assets=(
            DesmosLock-mac.dmg
            DesmosLock-mac-intel.dmg
            DesmosLock-setup.exe
            DesmosLock.AppImage
          )
          for asset in "${assets[@]}"; do
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 10 \
              --retry-delay 5 \
              --retry-all-errors \
              --output "public-assets/$asset" \
              "${release_url}/${asset}"
          done
          (cd public-assets && sha256sum --check SHA256SUMS.txt)

  promote-release:
    name: Promote verified prerelease to stable latest
    needs:
      - trusted-source
      - verify-public-assets
    if: >-
      ${{ needs.trusted-source.result == 'success' &&
          needs.trusted-source.outputs.is_release == 'true' &&
          needs.verify-public-assets.result == 'success' }}
    runs-on: ubuntu-latest
    environment: public-releases-write
    steps:
      - name: Recheck monotonic version and promote
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?RELEASES_REPO_TOKEN environment secret is required}"

          fail() {
            echo "::error::$*" >&2
            exit 1
          }

          repository_file="$RUNNER_TEMP/releases-repository.json"
          repository_status=$(curl --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --output "$repository_file" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$RELEASES_REPOSITORY")
          [[ "$repository_status" == 200 ]] || fail \
            "The public releases repository is unavailable (HTTP $repository_status)."
          [[ "$(node -e \
            "const d=require(process.argv[1]); process.stdout.write(String(d.private))" \
            "$repository_file")" == false ]] || fail \
            "The releases repository became private before promotion."

          response_file="$RUNNER_TEMP/latest-release.json"
          status=$(curl --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$RELEASES_REPOSITORY/releases/latest")
          case "$status" in
            200)
              latest_tag=$(node -e \
                "const d=require(process.argv[1]); process.stdout.write(String(d.tag_name || ''))" \
                "$response_file")
              node - "$GITHUB_REF_NAME" "$latest_tag" <<'NODE'
          const parse = (tag) => {
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag);
            if (!match) throw new Error(`not a strict stable SemVer tag: ${tag}`);
            return match.slice(1).map((part) => BigInt(part));
          };
          try {
            const candidate = parse(process.argv[2]);
            const latest = parse(process.argv[3]);
            const comparison = candidate.findIndex((part, index) => part !== latest[index]);
            if (comparison === -1 || candidate[comparison] < latest[comparison]) {
              throw new Error(`${process.argv[2]} is not newer than latest ${process.argv[3]}`);
            }
          } catch (error) {
            console.error(`::error::${error.message}`);
            process.exit(1);
          }
          NODE
              ;;
            404)
              echo "No current latest release exists; monotonic guard allows the first release."
              ;;
            *)
              fail "Could not safely recheck the current latest release (HTTP $status)."
              ;;
          esac

          release_id=$(gh api \
            "repos/$RELEASES_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq .id)
          state=$(gh api \
            "repos/$RELEASES_REPOSITORY/releases/$release_id" \
            --jq '[.draft, .prerelease] | @tsv')
          [[ "$state" == $'false\ttrue' ]] || fail \
            "Expected a public prerelease before promotion; found $state."
          gh api --method PATCH \
            "repos/$RELEASES_REPOSITORY/releases/$release_id" \
            -F prerelease=false \
            -f make_latest=true \
            --silent

  verify-latest-release:
    name: Verify latest tag and customer download routes
    needs:
      - trusted-source
      - verify-draft
      - promote-release
    if: >-
      ${{ needs.trusted-source.result == 'success' &&
          needs.trusted-source.outputs.is_release == 'true' &&
          needs.verify-draft.result == 'success' &&
          needs.promote-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert latest and verify its public assets without authentication
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.verify-draft.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Missing verified draft manifest digest"
            exit 1
          }
          response_file="$RUNNER_TEMP/latest-release.json"
          latest_verified=false
          for attempt in {1..12}; do
            status=$(curl --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/$RELEASES_REPOSITORY/releases/latest")
            if [[ "$status" == 200 ]]; then
              latest_tag=$(node -e \
                "const d=require(process.argv[1]); process.stdout.write(String(d.tag_name || ''))" \
                "$response_file")
              if [[ "$latest_tag" == "$GITHUB_REF_NAME" ]]; then
                echo "Latest release is $latest_tag."
                latest_verified=true
                break
              fi
            fi
            sleep 5
          done
          [[ "$latest_verified" == true ]] || {
            echo "::error::Unauthenticated releases/latest did not resolve to $GITHUB_REF_NAME"
            exit 1
          }

          mkdir latest-assets
          base_url="https://github.com/${RELEASES_REPOSITORY}/releases/latest/download"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --output latest-assets/SHA256SUMS.txt \
            "${base_url}/SHA256SUMS.txt"
          latest_manifest_sha256=$(sha256sum latest-assets/SHA256SUMS.txt | awk '{print $1}')
          [[ "$latest_manifest_sha256" == "$EXPECTED_MANIFEST_SHA256" ]] || {
            echo "::error::Latest SHA256SUMS.txt does not match the verified draft manifest"
            exit 1
          }
          assets=(
            DesmosLock-mac.dmg
            DesmosLock-mac-intel.dmg
            DesmosLock-setup.exe
            DesmosLock.AppImage
          )
          for asset in "${assets[@]}"; do
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --retry 10 \
              --retry-delay 5 \
              --retry-all-errors \
              --output "latest-assets/$asset" \
              "${base_url}/${asset}"
          done
          (cd latest-assets && sha256sum --check SHA256SUMS.txt)

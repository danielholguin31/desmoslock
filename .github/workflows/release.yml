name: Build v1.0.1 recovery installers

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main HEAD commit to build
        required: true
        type: string
      source_repository:
        description: Actual owner/repository hosting this workflow run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desmoslock-v1.0.1-recovery-build
  cancel-in-progress: false

jobs:
  trusted-source:
    name: Bind the run to exact main source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.preflight.outputs.source_sha }}
      source_repository: ${{ steps.preflight.outputs.source_repository }}
      source_repository_id: ${{ steps.preflight.outputs.source_repository_id }}
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an exact non-deleted main branch HEAD
        id: preflight
        shell: bash
        env:
          EVENT_DELETED: ${{ github.event.deleted == true }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          CONTEXT_SOURCE_REPOSITORY: ${{ github.repository }}
          CONTEXT_SOURCE_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_SOURCE_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_SOURCE_REPOSITORY_ID: ${{ github.event.repository.id }}
          TRUSTED_BRANCH: main
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*" >&2
            exit 1
          }

          case "$EVENT_DELETED" in
            false) ;;
            true) fail "Ref-deletion events must never build release installers." ;;
            *) fail "Could not safely determine whether the triggering ref was deleted." ;;
          esac

          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || fail \
            "Only a manual workflow_dispatch may build recovery installers."
          [[ "$GITHUB_REF" == "refs/heads/$TRUSTED_BRANCH" ]] || fail \
            "workflow_dispatch must run from refs/heads/$TRUSTED_BRANCH."
          [[ "$REQUESTED_SOURCE_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$ ]] || fail \
            "source_repository must be the actual owner/repository hosting this run."
          [[ "$REQUESTED_SOURCE_REPOSITORY" == "$CONTEXT_SOURCE_REPOSITORY" ]] || fail \
            "source_repository does not match github.repository."
          [[ "$REQUESTED_SOURCE_REPOSITORY" == "$EVENT_SOURCE_REPOSITORY" ]] || fail \
            "source_repository does not match github.event.repository.full_name."
          [[ "$REQUESTED_SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || fail \
            "source_repository does not match the runner repository identity."
          [[ "$CONTEXT_SOURCE_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]] || fail \
            "github.repository_id is missing or invalid."
          [[ "$CONTEXT_SOURCE_REPOSITORY_ID" == "$EVENT_SOURCE_REPOSITORY_ID" ]] || fail \
            "github.event.repository.id does not match github.repository_id."
          [[ "$CONTEXT_SOURCE_REPOSITORY_ID" == "$GITHUB_REPOSITORY_ID" ]] || fail \
            "runner repository ID does not match github.repository_id."
          [[ "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || fail \
            "source_sha must be an explicit 40-character lowercase commit SHA."

          origin_url=$(git remote get-url origin) || fail "origin remote is missing."
          origin_repository=$(node - "$origin_url" <<'NODE'
          const { parseGitHubRepositoryRemote } = require('./desktop/scripts/provenance-contract');
          process.stdout.write(parseGitHubRepositoryRemote(process.argv[2]));
          NODE
          ) || fail "origin is not an uncredentialed GitHub repository URL."
          [[ "$origin_repository" == "$REQUESTED_SOURCE_REPOSITORY" ]] || fail \
            "origin repository $origin_repository does not match $REQUESTED_SOURCE_REPOSITORY."

          source_sha=$(git rev-parse "${REQUESTED_SOURCE_SHA}^{commit}" 2>/dev/null) || fail \
            "source_sha does not identify a fetched commit."
          [[ "$source_sha" == "$REQUESTED_SOURCE_SHA" ]] || fail \
            "source_sha must be the commit's canonical full SHA."
          trigger_sha=$(git rev-parse "${GITHUB_SHA}^{commit}")
          [[ "$trigger_sha" == "$source_sha" ]] || fail \
            "Requested source $source_sha is not the workflow_dispatch HEAD $trigger_sha."
          [[ "$source_sha" == "$(git rev-parse 'HEAD^{commit}')" ]] || fail \
            "Checked-out source does not match the requested commit."

          git show-ref --verify --quiet "refs/remotes/origin/$TRUSTED_BRANCH" || fail \
            "Fetched origin/$TRUSTED_BRANCH is missing."
          branch_sha=$(git rev-parse "refs/remotes/origin/$TRUSTED_BRANCH^{commit}")
          [[ "$branch_sha" == "$source_sha" ]] || fail \
            "Requested source is not the fetched origin/$TRUSTED_BRANCH HEAD."
          git merge-base --is-ancestor \
            "$source_sha" "refs/remotes/origin/$TRUSTED_BRANCH" || fail \
            "Requested source is not contained in origin/$TRUSTED_BRANCH."

          package_version=$(node -p "require('./desktop/package.json').version")
          [[ "$package_version" == 1.0.1 ]] || fail \
            "The recovery workflow requires desktop version 1.0.1; found $package_version."

          {
            echo "source_sha=$source_sha"
            echo "source_repository=$REQUESTED_SOURCE_REPOSITORY"
            echo "source_repository_id=$CONTEXT_SOURCE_REPOSITORY_ID"
            echo "version=$package_version"
          } >> "$GITHUB_OUTPUT"

      - name: Test fail-closed force-quit recovery
        run: npm --prefix desktop run test:recovery

      - name: Test fail-closed release provenance
        run: npm --prefix desktop run test:provenance

  build-windows:
    name: Build Windows installer
    needs: trusted-source
    if: ${{ needs.trusted-source.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trusted-source.outputs.source_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.trusted-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Checkout has tracked, staged, or untracked source changes." >&2
            exit 1
          }
          [[ -z "$(git ls-files --others --ignored --exclude-standard -- \
            desktop/main.js desktop/preload.js desktop/renderer)" ]] || {
            echo "Ignored files are present inside Electron's explicit source inputs." >&2
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Use npm 10
        run: npm install --global npm@10.9.9

      - name: Install locked dependencies
        working-directory: desktop
        run: npm ci

      - name: Rebuild committed browser dependencies
        working-directory: desktop
        run: npm run build:vendor

      - name: Require all packaged source to match the exact commit
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Dependency installation or vendor rebuild changed tracked, staged, or untracked source." >&2
            exit 1
          }
          [[ -z "$(git ls-files --others --ignored --exclude-standard -- \
            desktop/main.js desktop/preload.js desktop/renderer)" ]] || {
            echo "Ignored files are present inside Electron's explicit source inputs." >&2
            exit 1
          }

      - name: Build x64 Windows installer
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      - name: Require exactly one Windows installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(desktop/dist/*.exe)
          [[ ${#installers[@]} -eq 1 ]] || {
            echo "Expected one Windows installer; found ${#installers[@]}." >&2
            exit 1
          }

      - name: Verify AMD64 payload and record source-bound metadata
        shell: bash
        env:
          BUILD_PLATFORM: windows
          SOURCE_SHA: ${{ needs.trusted-source.outputs.source_sha }}
          SOURCE_REPOSITORY: ${{ needs.trusted-source.outputs.source_repository }}
          SOURCE_REPOSITORY_ID: ${{ needs.trusted-source.outputs.source_repository_id }}
          RUNNER_REQUESTED_LABEL: windows-latest
        run: node desktop/scripts/write-build-metadata.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-windows-${{ needs.trusted-source.outputs.source_sha }}
          path: |
            desktop/dist/*.exe
            desktop/dist/win-unpacked/DesmosLock.exe
            desktop/dist/win-unpacked/resources/app.asar
            desktop/dist/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-linux:
    name: Build Linux AppImage
    needs: trusted-source
    if: ${{ needs.trusted-source.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.trusted-source.outputs.source_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.trusted-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Checkout has tracked, staged, or untracked source changes." >&2
            exit 1
          }
          [[ -z "$(git ls-files --others --ignored --exclude-standard -- \
            desktop/main.js desktop/preload.js desktop/renderer)" ]] || {
            echo "Ignored files are present inside Electron's explicit source inputs." >&2
            exit 1
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Use npm 10
        run: npm install --global npm@10.9.9

      - name: Install locked dependencies
        working-directory: desktop
        run: npm ci

      - name: Rebuild committed browser dependencies
        working-directory: desktop
        run: npm run build:vendor

      - name: Require all packaged source to match the exact commit
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Dependency installation or vendor rebuild changed tracked, staged, or untracked source." >&2
            exit 1
          }
          [[ -z "$(git ls-files --others --ignored --exclude-standard -- \
            desktop/main.js desktop/preload.js desktop/renderer)" ]] || {
            echo "Ignored files are present inside Electron's explicit source inputs." >&2
            exit 1
          }

      - name: Build x64 Linux AppImage
        working-directory: desktop
        run: npx electron-builder --linux --x64 --publish never

      - name: Require exactly one Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(desktop/dist/*.AppImage)
          [[ ${#installers[@]} -eq 1 ]] || {
            echo "Expected one Linux AppImage; found ${#installers[@]}." >&2
            exit 1
          }

      - name: Record source-bound build metadata
        shell: bash
        env:
          BUILD_PLATFORM: linux
          SOURCE_SHA: ${{ needs.trusted-source.outputs.source_sha }}
          SOURCE_REPOSITORY: ${{ needs.trusted-source.outputs.source_repository }}
          SOURCE_REPOSITORY_ID: ${{ needs.trusted-source.outputs.source_repository_id }}
          RUNNER_REQUESTED_LABEL: ubuntu-latest
        run: node desktop/scripts/write-build-metadata.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-linux-${{ needs.trusted-source.outputs.source_sha }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/BUILD-METADATA.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

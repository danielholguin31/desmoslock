name: Required v2 verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_required_check_failure:
        description: Deliberately fail the required-check probe
        required: false
        type: boolean
        default: false

concurrency:
  group: v2-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Format, lint, typecheck, and repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:repository
      - run: npm run verify:repository

  unit-and-evidence:
    name: Unit, recovery, provenance, and Gatekeeper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:evidence
        env:
          GIT_DIR: /nonexistent

  database-rls:
    name: Disposable database reset and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run test:db
      - if: always()
        run: npm run db:stop

  edge-functions:
    name: Edge Function type and behavior checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:edge

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web

  electron:
    name: Electron build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:electron
        env:
          ELECTRON_DISABLE_SANDBOX: "1"

  supply-chain:
    name: Dependency, secret, SBOM, and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:dependencies
      - run: npm run test:secrets
      - run: npm run test:workflows
      - run: npm run verify:locks
      - run: npm run build
      - run: npm run sbom
      - run: npm run verify:licenses
      - run: npm run verify:packages

  required-check-probe:
    name: Required-check failure plumbing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:required-check-probe
        env:
          DESMOSLOCK_FORCE_REQUIRED_CHECK_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_required_check_failure == true }}

  required:
    name: Required v2 verification
    if: ${{ always() }}
    needs:
      - static
      - unit-and-evidence
      - database-rls
      - edge-functions
      - web
      - electron
      - supply-chain
      - required-check-probe
    runs-on: ubuntu-latest
    steps:
      - name: Reject any failed, cancelled, or skipped dependency
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - name: Confirm every required v2 check passed
        run: echo "All required v2 checks passed."

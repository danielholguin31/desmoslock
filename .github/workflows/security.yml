name: Required v2 security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: v2-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supply-chain:
    name: Dependency, secret, workflow, SBOM, and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:dependencies
      - run: npm run test:secrets
      - run: npm run test:workflows
      - run: npm run verify:locks
      - run: npm run build
      - run: npm run sbom
      - run: npm run verify:licenses
      - run: npm run verify:packages

  required:
    name: Security required
    if: ${{ always() }}
    needs:
      - supply-chain
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled, or skipped security checks
        if: ${{ needs.supply-chain.result != 'success' }}
        run: exit 1
      - run: echo "All required v2 security checks passed."

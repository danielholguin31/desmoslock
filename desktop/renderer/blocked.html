<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Locked</title>
<style>
  html, body {
    height: 100%; margin: 0;
    background: #ffffff; color: #37352f;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: grid; place-items: center;
    user-select: none; cursor: not-allowed; overflow: hidden;
  }
  .box { text-align: center; padding: 40px; }
  .icon { font-size: 40px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
  p { font-size: 14px; color: rgba(55, 53, 47, 0.65); margin: 0; line-height: 1.5; }
  .rule { width: 40px; height: 3px; border-radius: 2px; background: #e03e3e; margin: 22px auto 0; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🔒</div>
    <h1>This screen is locked</h1>
    <p>Your test is running on the main display.<br>Move back to the calculator to keep working.</p>
    <div class="rule"></div>
  </div>
</body>
</html>
